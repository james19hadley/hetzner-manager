# docker.conf - Netdata docker collector configuration
# Placed in /etc/netdata/go.d/docker.conf on the remote server

# Reduce update frequency to 30 seconds to minimize CPU footprint of dockerd/containerd
update_every: 30

jobs:
  - name: local
    address: 'unix:///var/run/docker.sock'
    timeout: 2
    collect_container_size: no
