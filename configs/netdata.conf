# netdata.conf - Optimized configuration for Hetzner VPS (4GB RAM)
# Placed in /etc/netdata/netdata.conf on the remote server

[global]
    run as user = netdata
    update every = 1
    memory mode = dbengine

[db]
    # Limit database engine memory footprint (RAM)
    dbengine page cache size MiB = 16
    # Limit database engine disk footprint (256MB is enough for ~1-2 weeks of history)
    dbengine disk space MiB = 256

[ml]
    # Disable machine learning anomaly detection to save CPU resources
    enabled = no

[web]
    # Bind to all interfaces so Netdata is reachable via Tailscale IP (protected by UFW)
    bind to = *
