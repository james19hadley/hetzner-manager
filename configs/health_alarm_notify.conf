# health_alarm_notify.conf - Alert notification overrides for Netdata
# Placed in /etc/netdata/health_alarm_notify.conf

# Enable Email and Telegram alerts
SEND_EMAIL="YES"
SEND_TELEGRAM="YES"

# --- EMAIL SETTINGS ---
# The sender address Netdata will use
EMAIL_SENDER="server-alerts@pulsemonolith.com"
# Default recipient for all alarms (replace with your personal email)
DEFAULT_RECIPIENT_EMAIL="ging.test@gmail.com"

# --- TELEGRAM SETTINGS ---
# Bot token (replace with your own Bot Token from @BotFather)
TELEGRAM_BOT_TOKEN=""
# Recipient Chat ID (replace with your Telegram User ID, e.g. from @userinfobot)
DEFAULT_RECIPIENT_TELEGRAM=""
